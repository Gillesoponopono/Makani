name: Forecast data

# Hourly light check (one ~13 KB request to ERDDAP). Heavier work only when needed:
#  - new WRF run complete -> rebuild the site's forecast JSON and archive the
#    run exactly as issued from PacIOOS THREDDS (archive/forecast/);
#  - every ~6 h with the same run -> rebuild it anyway, for fresh waves, sea
#    temperature and tides (PacIOOS skips a day of WRF every week or so);
#  - every ~6 h -> merge the last 7 days of observed wind (Kahului Harbor +
#    Airport) into archive/obs/.
# When anything changed it force-pushes the data dir to the orphan `data`
# branch (one commit, so git history never grows; archive files accumulate)
# and redeploys the site. Run manually with large forecast_days / obs_days to
# backfill history.
on:
  schedule:
    - cron: "7 * * * *"  # minute 7: away from the top-of-hour rush
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the model run is unchanged
        type: boolean
        default: false
      obs_days:
        description: Days of observations to fetch (e.g. 400 to backfill Kahului Harbor history)
        type: number
        default: 7
      forecast_days:
        description: Archive missing forecast runs from the last N days (e.g. 400 to backfill; ~20 min)
        type: number
        default: 10

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # only a manual backfill takes long; hourly runs take ~30 s
    outputs:
      changed: ${{ steps.build.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The archive only exists on the data branch: if it can't be restored,
      # stop rather than publish an empty one.
      - name: Restore previously published data
        id: restore
        run: |
          mkdir -p data
          set +e
          git ls-remote --exit-code --heads origin data >/dev/null
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            git fetch --depth=1 origin data
            git archive FETCH_HEAD | tar -x -C data
            old=$(git ls-tree -r --name-only FETCH_HEAD -- archive | grep '\.json$' | grep -vc '^archive/index\.json$' || true)
            echo "archive_files=$old" >> "$GITHUB_OUTPUT"
            echo "Restored data branch with $old archive files"
          elif [ "$rc" -eq 2 ]; then
            echo "archive_files=0" >> "$GITHUB_OUTPUT"
            echo "No data branch yet (first run)"
          else
            echo "::error::git ls-remote failed ($rc)"; exit "$rc"
          fi

      # Cheap diagnostics for when PacIOOS is unreachable from some runners.
      - name: Connectivity probe
        continue-on-error: true
        run: |
          echo "runner ip: $(curl -s -m 10 https://api.ipify.org || echo unknown)"
          curl -s -o /dev/null -m 20 -w "ERDDAP %{http_code} connect %{time_connect}s\n" \
            https://pae-paha.pacioos.hawaii.edu/erddap/info/wrf_mo/index.csv || echo "ERDDAP unreachable (curl exit $?)"

      - name: Build forecast JSON
        id: build
        working-directory: pipeline
        run: >-
          python -m makani.build --out ../data
          --forecast-days ${{ inputs.forecast_days || 10 }}
          --obs-days ${{ inputs.obs_days || 7 }}
          ${{ github.event_name == 'schedule' && '--obs-every-hours 6 --refresh-every-hours 6' || '' }}
          ${{ inputs.force && '--force' || '' }}

      - name: Publish to data branch
        if: steps.build.outputs.changed == 'true'
        working-directory: data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          new=$(find archive -name '*.json' ! -path 'archive/index.json' | wc -l | tr -d ' ')
          old="${{ steps.restore.outputs.archive_files }}"
          if [ "$new" -lt "$old" ]; then
            echo "::error::Archive would shrink from $old to $new files; refusing to publish"; exit 1
          fi
          git init -q -b data
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Forecast data, WRF run ending $(jq -r '.wrf.coverageEnd' meta.json), $(jq '.forecastRuns | length' archive/index.json) archived runs"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      # Scheduled workflows in public repos are disabled after 60 days without
      # activity; re-enabling via the API resets that timer.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$(date -u +%H)" = "04" ] || exit 0  # once a day is plenty
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/forecast.yml/enable" || true

  deploy:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
