name: Deploy site

# Builds the Svelte app with the latest forecast data (from the `data` branch)
# and deploys it to GitHub Pages. Runs on code changes, manually, or when
# called by forecast.yml after new data is published.
on:
  push:
    branches: [main]
    paths: ["web/**", "config/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch latest forecast data
        run: |
          mkdir -p web/public/data
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git archive FETCH_HEAD | tar -x -C web/public/data
            echo "Data: $(jq -r '.wrf.coverageEnd' web/public/data/meta.json)"
          else
            echo "::warning::No data branch yet; deploying without forecast data"
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
